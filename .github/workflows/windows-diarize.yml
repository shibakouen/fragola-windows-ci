name: windows-diarize
on:
  workflow_dispatch:
    inputs:
      setup:
        description: Windows setup.exe URL
        required: true
        default: https://tkd2vapgc8gjrjb3.public.blob.vercel-storage.com/downloads/Lamponi-1.0.0-x64-setup.exe
jobs:
  diarize-load:
    runs-on: windows-2022
    steps:
      - name: Download + silent-install the published exe
        shell: pwsh
        run: |
          curl.exe -fL -o setup.exe "${{ github.event.inputs.setup }}"
          curl.exe -fL -o mono2p.wav "https://tkd2vapgc8gjrjb3.public.blob.vercel-storage.com/downloads/_test/mono2p.wav"
          Start-Process -Wait -FilePath .\setup.exe -ArgumentList '/S'
          $exe = "$env:LOCALAPPDATA\Programs\Lamponi\Lamponi.exe"
          if (!(Test-Path $exe)) { $exe = (Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Recurse -Filter Lamponi.exe | Select-Object -First 1).FullName }
          echo "EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "installed at $exe"
      - name: Launch + assert sherpa loads on Windows
        shell: pwsh
        run: |
          npm init -y | Out-Null
          npm i -D playwright | Out-Null
          @'
          import { _electron } from 'playwright'
          import { readFileSync } from 'fs'
          const wav = readFileSync('mono2p.wav')
          const b64 = Buffer.from(wav.buffer, wav.byteOffset + 44, wav.length - 44).toString('base64')
          const app = await _electron.launch({ executablePath: process.env.EXE, args: [], env: { ...process.env, FRAGOLA_USERDATA_DIR: process.env.TEMP + '\\prof' } })
          let page = await app.firstWindow()
          if (page.url().includes('floating')) page = (await app.windows()).find((w) => !w.url().includes('floating')) ?? page
          await page.waitForLoadState('domcontentloaded'); await page.waitForTimeout(2500)
          const r = await page.evaluate(async (b64) => {
            const bin = atob(b64); const by = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) by[i]=bin.charCodeAt(i)
            const i16 = new Int16Array(by.buffer); const f = new Float32Array(i16.length); for (let i=0;i<i16.length;i++) f[i]=i16[i]/32768
            const live = [0,1].map(b => ({ start: b*60, end: b*60+60, words: Array.from({length:30}, (_,i)=>({ word:'w'+i, start:b*60+i*2, end:b*60+i*2+1, punctuated_word:'W'+i })) }))
            return (await window.fragola.diarize.reprocess(f.buffer, 2, 'multi', undefined, live)).data
          }, b64)
          console.log('RESULT', JSON.stringify({ method: r?.method, speakers: r?.speakers?.length }))
          const ok = r?.method === 'sherpa+live' && r?.speakers?.length === 2
          console.log(ok ? 'WINDOWS SHERPA LOADS — PASS' : 'FAIL method=' + r?.method)
          await app.close().catch(()=>{})
          process.exit(ok ? 0 : 1)
          '@ | Out-File -Encoding utf8 t.mjs
          node t.mjs
