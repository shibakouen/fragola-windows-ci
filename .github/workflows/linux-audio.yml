name: linux-audio
on:
  workflow_dispatch:
env:
  XDG_RUNTIME_DIR: /tmp/pulse-rt
jobs:
  parec-monitor-capture:
    runs-on: ubuntu-22.04
    steps:
      - name: Install PulseAudio + ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio pulseaudio-utils ffmpeg python3
      - name: PulseAudio + null-sink + tone, then parec-capture the monitor (the app's exact mechanism)
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1 --disable-shm=1
          sleep 3
          pactl load-module module-null-sink sink_name=virtsink sink_properties=device.description=VirtualSink
          pactl set-default-sink virtsink
          echo "=== sources ==="; pactl list short sources
          ffmpeg -nostdin -f lavfi -i "sine=frequency=440:duration=5:sample_rate=48000" -ac 2 /tmp/tone.wav -y >/dev/null 2>&1
          nohup bash -c 'while true; do paplay --device=virtsink /tmp/tone.wav 2>>/tmp/paplay.err || sleep 1; done' >/dev/null 2>&1 &
          sleep 3
          echo "=== sink-inputs (tone playing?) ==="; pactl list short sink-inputs
          # THE APP'S MECHANISM: parec on the default sink's monitor → raw 16k mono s16le
          timeout 4 parec --format=s16le --rate=16000 --channels=1 --raw --device=@DEFAULT_MONITOR@ > /tmp/cap.raw || true
          echo "captured bytes: $(wc -c < /tmp/cap.raw)"
          python3 - <<'PY'
          import struct, math, sys
          d = open('/tmp/cap.raw','rb').read()
          n = len(d)//2
          if n == 0:
              print("RESULT", '{"ok":false,"reason":"no PCM captured"}'); sys.exit(1)
          s = struct.unpack('<%dh' % n, d[:n*2])
          rms = math.sqrt(sum(x*x for x in s)/n)/32768
          peak = max(abs(x) for x in s)/32768
          ok = rms > 0.01
          print("RESULT", '{"ok":%s,"rms":%.4f,"peak":%.4f,"samples":%d}' % (str(ok).lower(), rms, peak, n))
          sys.exit(0 if ok else 1)
          PY
