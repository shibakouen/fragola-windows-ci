name: linux-audio
on:
  workflow_dispatch:
jobs:
  monitor-capture:
    runs-on: ubuntu-22.04
    steps:
      - name: Install PulseAudio + ffmpeg + chromium deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio pulseaudio-utils ffmpeg \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgtk-3-0 \
            libgbm1 libasound2 libxshmfence1 libxdamage1 libxrandr2 libxcomposite1 libxfixes3
      - name: Start PulseAudio with a null-sink + play a tone into it
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          sudo mkdir -p $XDG_RUNTIME_DIR && sudo chown $(id -u):$(id -g) $XDG_RUNTIME_DIR
          pulseaudio --start --exit-idle-time=-1 --disallow-exit
          sleep 2
          pactl load-module module-null-sink sink_name=virtsink sink_properties=device.description=VirtualSink
          pactl set-default-sink virtsink
          echo "=== sinks ==="; pactl list short sinks
          echo "=== sources (monitor should appear) ==="; pactl list short sources
          # loop a 440Hz tone into the virtual sink so its monitor carries signal
          nohup ffmpeg -nostdin -re -f lavfi -i "sine=frequency=440:sample_rate=48000" \
            -t 600 -f pulse -device virtsink LamponiTone >/tmp/ffmpeg.log 2>&1 &
          sleep 3
          echo "tone playing; sink-inputs:"; pactl list short sink-inputs
      - name: Capture the monitor in Chromium and measure RMS
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          npm init -y >/dev/null 2>&1
          npm i -D playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat > test.mjs <<'JS'
          import { chromium } from 'playwright'
          const b = await chromium.launch({ args: ['--no-sandbox','--use-fake-ui-for-media-stream','--autoplay-policy=no-user-gesture-required'] })
          const p = await (await b.newContext()).newPage()
          await p.goto('about:blank')
          const r = await p.evaluate(async () => {
            await navigator.mediaDevices.getUserMedia({audio:true}).then(s=>s.getTracks().forEach(t=>t.stop()))
            const devs = await navigator.mediaDevices.enumerateDevices()
            const mon = devs.find(d=>d.kind==='audioinput' && /monitor/i.test(d.label) && d.deviceId!=='default' && d.deviceId!=='communications')
            if (!mon) return { ok:false, reason:'no monitor', devs: devs.filter(d=>d.kind==='audioinput').map(d=>d.label) }
            const stream = await navigator.mediaDevices.getUserMedia({audio:{deviceId:{exact:mon.deviceId}, echoCancellation:false, noiseSuppression:false, autoGainControl:false}})
            const ac = new AudioContext()
            const an = ac.createAnalyser(); an.fftSize = 2048
            ac.createMediaStreamSource(stream).connect(an)
            const buf = new Float32Array(an.fftSize)
            let peak = 0
            const t0 = performance.now()
            while (performance.now()-t0 < 3000) {
              an.getFloatTimeDomainData(buf)
              let s=0; for (const v of buf) s+=v*v
              const rms = Math.sqrt(s/buf.length)
              if (rms>peak) peak=rms
              await new Promise(r=>setTimeout(r,80))
            }
            return { ok: peak > 0.01, peak: Number(peak.toFixed(4)), monitor: mon.label }
          })
          console.log('RESULT', JSON.stringify(r))
          await b.close()
          process.exit(r.ok ? 0 : 1)
          JS
          node test.mjs
