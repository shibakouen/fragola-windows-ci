name: windows-msix-loopback

# Does Chromium/Electron WASAPI loopback audio capture survive MSIX
# containerization?
#
# This is the go/no-go gate for putting Lamponi in the Microsoft Store. The
# Store's MSIX path is the only distribution route with free code signing and
# zero SmartScreen warnings, but Lamponi's core Windows feature is system-audio
# loopback, and a packaged app reaches privacy-gated audio only through declared
# capabilities.
#
# Design: one identical Electron probe (same Electron 40.4.1, same
# electron-audio-loopback 1.0.6, same electron-builder 26.8.1 as Lamponi) is
# built BOTH unpackaged and as MSIX, then run on the SAME machine. The container
# is the only variable, so the comparison stays valid even though a CI runner
# has no real audio hardware.

on:
  workflow_dispatch:

jobs:
  loopback-msix-vs-plain:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: msix-loopback-probe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare result directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\probeout | Out-Null
          icacls C:\probeout /grant "Everyone:(OI)(CI)F" | Out-Null
          Write-Host "C:\probeout ready"

      - name: Audio subsystem inventory (best effort)
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "--- Windows Audio service ---"
          Get-Service audiosrv | Format-List Name,Status,StartType
          try {
            Set-Service audiosrv -StartupType Automatic -ErrorAction Stop
            Start-Service audiosrv -ErrorAction Stop
            Write-Host "audiosrv started"
          } catch { Write-Host "could not start audiosrv: $($_.Exception.Message)" }
          Get-Service audiosrv | Format-List Name,Status
          Write-Host "--- Audio endpoint devices ---"
          Get-CimInstance Win32_SoundDevice | Select-Object Name,Status,Manufacturer | Format-Table -AutoSize
          Write-Host "(no endpoint is expected on a bare runner; the plain-vs-MSIX comparison is what matters)"

      - name: Enable developer mode (allows loose MSIX registration)
        shell: pwsh
        continue-on-error: true
        run: |
          $k = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          New-Item -Path $k -Force | Out-Null
          New-ItemProperty -Path $k -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWORD -Force | Out-Null
          New-ItemProperty -Path $k -Name AllowAllTrustedApps -Value 1 -PropertyType DWORD -Force | Out-Null
          Write-Host "developer mode keys set"

      - name: Install probe dependencies
        run: npm install --no-audit --no-fund

      - name: Build BOTH unpackaged and MSIX
        shell: pwsh
        run: |
          npx electron-builder --win dir appx
          Write-Host "--- dist tree ---"
          Get-ChildItem -Recurse dist -Depth 2 | Select-Object FullName,Length | Format-Table -AutoSize

      # ---------------------------------------------------------------- PLAIN
      - name: Run UNPACKAGED probe (control)
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = Get-ChildItem -Recurse dist -Filter LoopbackProbe.exe |
                 Where-Object { $_.FullName -like "*win-unpacked*" } |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "unpacked exe not found" }
          Write-Host "Launching control: $exe"
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput C:\probeout\plain-stdout.txt -RedirectStandardError C:\probeout\plain-stderr.txt
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "control probe timed out" }
          Write-Host "control exit code: $($p.ExitCode)"
          if (Test-Path C:\probeout\plain-stdout.txt) { Get-Content C:\probeout\plain-stdout.txt }

      # ----------------------------------------------------------------- MSIX
      - name: Install the MSIX package
        shell: pwsh
        continue-on-error: true
        run: |
          $appx = Get-ChildItem -Recurse dist -Include *.appx,*.msix |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $appx) { throw "no .appx/.msix produced" }
          Write-Host "Package: $appx"

          $installed = $false

          # Path A: self-sign, trust, install as a real signed package.
          try {
            $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=ProbePublisher" `
                      -KeyUsage DigitalSignature -FriendlyName "MSIX probe" `
                      -CertStoreLocation "Cert:\CurrentUser\My" `
                      -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}")
            $pwd = ConvertTo-SecureString -String "probepass" -Force -AsPlainText
            Export-PfxCertificate -cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" -FilePath C:\probeout\probe.pfx -Password $pwd | Out-Null
            Import-PfxCertificate -FilePath C:\probeout\probe.pfx -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Password $pwd | Out-Null
            Import-PfxCertificate -FilePath C:\probeout\probe.pfx -CertStoreLocation Cert:\LocalMachine\Root -Password $pwd | Out-Null

            $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
                   Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName "x64\signtool.exe" } |
                   Where-Object { Test-Path $_ } | Select-Object -First 1
            Write-Host "signtool: $sdk"
            & $sdk sign /fd SHA256 /f C:\probeout\probe.pfx /p probepass $appx
            Add-AppxPackage -Path $appx -ErrorAction Stop
            $installed = $true
            Write-Host "installed via signed package"
          } catch {
            Write-Host "signed install failed: $($_.Exception.Message)"
          }

          # Path B: loose-file registration from the unpacked staging dir.
          if (-not $installed) {
            try {
              $manifest = Get-ChildItem -Recurse dist -Filter AppxManifest.xml | Select-Object -First 1 -ExpandProperty FullName
              if (-not $manifest) { throw "no AppxManifest.xml in dist" }
              Write-Host "registering loose manifest: $manifest"
              Add-AppxPackage -Register $manifest -ErrorAction Stop
              $installed = $true
              Write-Host "installed via loose registration"
            } catch {
              Write-Host "loose registration failed: $($_.Exception.Message)"
            }
          }

          if (-not $installed) { throw "could not install the MSIX by either route" }
          Get-AppxPackage -Name "*LoopbackProbe*" | Format-List Name,PackageFullName,PackageFamilyName,InstallLocation

      - name: Run MSIX probe (test)
        shell: pwsh
        continue-on-error: true
        run: |
          $pkg = Get-AppxPackage -Name "*LoopbackProbe*" | Select-Object -First 1
          if (-not $pkg) { throw "package not registered" }
          $appid = (Get-AppxPackageManifest $pkg).Package.Applications.Application.Id
          $aumid = "$($pkg.PackageFamilyName)!$appid"
          Write-Host "AUMID: $aumid"
          Start-Process "shell:AppsFolder\$aumid"
          # A packaged app gives us no stdout, so wait on the result file.
          $deadline = (Get-Date).AddSeconds(120)
          while ((Get-Date) -lt $deadline -and -not (Test-Path C:\probeout\result-msix.json)) {
            Start-Sleep -Seconds 3
          }
          if (Test-Path C:\probeout\result-msix.json) { Write-Host "msix result file appeared" }
          else { Write-Host "msix result file DID NOT appear within 120s" }
          Get-Process LoopbackProbe -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      # ------------------------------------------------------------- VERDICT
      - name: Compare and report
        if: always()
        shell: pwsh
        run: |
          function Show($label, $path) {
            Write-Host ""
            Write-Host "================ $label ================"
            if (Test-Path $path) { Get-Content $path } else { Write-Host "(missing: $path)" }
          }
          Show "CONTROL (unpackaged)" C:\probeout\result-plain.json
          Show "TEST (MSIX)"          C:\probeout\result-msix.json

          $plain = $null; $msix = $null
          if (Test-Path C:\probeout\result-plain.json) { $plain = Get-Content C:\probeout\result-plain.json -Raw | ConvertFrom-Json }
          if (Test-Path C:\probeout\result-msix.json)  { $msix  = Get-Content C:\probeout\result-msix.json  -Raw | ConvertFrom-Json }

          Write-Host ""
          Write-Host "======================= VERDICT ======================="
          if (-not $plain) {
            Write-Host "INCONCLUSIVE: the unpackaged control did not produce a result."
          } elseif (-not $msix) {
            Write-Host "INCONCLUSIVE or MSIX-BLOCKED: control ran, MSIX produced nothing."
            Write-Host "control trackObtained = $($plain.trackObtained) / ok = $($plain.ok) / stage = $($plain.stage)"
          } else {
            Write-Host ("control : ok={0} trackObtained={1} stage={2} tracks={3} peakRms={4} tone={5}" -f $plain.ok,$plain.trackObtained,$plain.stage,$plain.audioTrackCount,$plain.peakRms,$plain.toneDetected)
            Write-Host ("msix    : ok={0} trackObtained={1} stage={2} tracks={3} peakRms={4} tone={5}" -f $msix.ok,$msix.trackObtained,$msix.stage,$msix.audioTrackCount,$msix.peakRms,$msix.toneDetected)
            Write-Host ""
            if ($plain.trackObtained -and $msix.trackObtained) {
              Write-Host "RESULT: MSIX PERMITS loopback capture. The container did not block it."
              if ($plain.signalDetected -and $msix.signalDetected) { Write-Host "        Real audio flowed in BOTH. Strongest possible pass." }
              elseif (-not $plain.signalDetected) { Write-Host "        Neither carried signal, but the control did not either, so this runner has no audio endpoint. API-level pass only." }
              else { Write-Host "        WARNING: control carried signal and MSIX did not. Investigate." }
            } elseif ($plain.trackObtained -and -not $msix.trackObtained) {
              Write-Host "RESULT: MSIX BLOCKS loopback capture. Store MSIX path is NOT viable for Lamponi."
              Write-Host "        msix failed at stage: $($msix.stage) / $($msix.error)"
            } else {
              Write-Host "INCONCLUSIVE: the control itself could not obtain a track (stage $($plain.stage): $($plain.error))."
            }
          }
          Write-Host "======================================================"

      - name: Upload all probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msix-loopback-probe-results
          path: C:\probeout\
          if-no-files-found: warn
